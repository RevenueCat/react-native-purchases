appId: com.revenuecat.automatedsdktests
name: Custom checkpoint presenter completes after owner unmounts

---
- clearState
- pressKey: home
- launchApp:
    arguments:
      e2e_test_flow: checkpoint_custom_presenter_unmount
      rc_test_api_key: "${typeof MAESTRO_RC_TEST_API_KEY === 'undefined' ? '' : MAESTRO_RC_TEST_API_KEY}"
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Hit custom checkpoint"
    timeout: 30000
- tapOn:
    id: "hit-custom-checkpoint-button"
- runFlow:
    file: ../utils/assert_custom_checkpoint_presenter.yaml
- scrollUntilVisible:
    element:
      id: "unmount-checkpoint-owner-button"
    direction: DOWN
- tapOn:
    id: "unmount-checkpoint-owner-button"
- scrollUntilVisible:
    element: "Checkpoint owner: unmounted"
    direction: UP
- extendedWaitUntil:
    visible: "Checkpoint owner: unmounted"
    timeout: 10000
- assertVisible: "Custom checkpoint paywall"
- assertVisible: "Callback count: 0"
- scrollUntilVisible:
    element:
      id: "custom-checkpoint-buy-button"
    direction: DOWN
- tapOn:
    id: "custom-checkpoint-buy-button"
- runFlow:
    file: ../utils/confirm_purchase.yaml
- scrollUntilVisible:
    element: "Purchase: .*"
    direction: UP
- extendedWaitUntil:
    visible: "Purchase: complete"
    timeout: 30000
- scrollUntilVisible:
    element: "Checkpoint owner: unmounted"
    direction: UP
- assertVisible: "Callback count: 0"
- scrollUntilVisible:
    element:
      id: "custom-checkpoint-continue-button"
    direction: DOWN
- tapOn:
    id: "custom-checkpoint-continue-button"
- scrollUntilVisible:
    element: "Checkpoint owner: unmounted"
    direction: UP
- extendedWaitUntil:
    visible: "Completion count: 1"
    timeout: 10000
- assertVisible: "Last completion: CONTINUED"
- assertVisible: "Callback count: 0"
- assertVisible: "Stale callbacks: 0"
- assertNotVisible: "Custom checkpoint paywall"
- tapOn:
    id: "remount-checkpoint-owner-button"
# Native synchronization may still be finishing after the detached completion.
# Retry only starting the next call; never retry the purchase or the whole flow.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "hit-custom-checkpoint-button"
      - extendedWaitUntil:
          visible: "Custom checkpoint paywall"
          timeout: 8000
- runFlow:
    file: ../utils/assert_custom_checkpoint_presenter.yaml
- assertVisible: "Presentation count: 2"
- assertVisible: "Callback count: 0"
# This customer now has pro. Closing the second UI exercises CLOSED and lets only
# the new owner receive onPassed; the old observer remains able to detect a leak.
- scrollUntilVisible:
    element:
      id: "custom-checkpoint-close-button"
    direction: DOWN
- tapOn:
    id: "custom-checkpoint-close-button"
- scrollUntilVisible:
    element: "Checkpoint owner: mounted"
    direction: UP
- extendedWaitUntil:
    visible: "Callback count: 1"
    timeout: 30000
- assertVisible: "Completion count: 2"
- assertVisible: "Last completion: CLOSED"
- assertVisible: "Customer active entitlements: pro"
- assertVisible: "Callbacks before completion: 0"
- assertVisible: "Stale callbacks: 0"
- assertNotVisible: "Custom checkpoint paywall"
