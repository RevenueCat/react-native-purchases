name: Hotfix

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  hotfix:
    if: github.repository_visibility != 'public'
    permissions:
      issues: write
      pull-requests: write
    uses: revenuecat/sdk-github-workflows/.github/workflows/hotfix.yml@3077be7205711312d52ebcf2bea12360c2b1a5f2 # v11.2.0
    secrets:
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
